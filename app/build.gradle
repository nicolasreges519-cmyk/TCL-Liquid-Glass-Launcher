plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meulauncher.glass'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meulauncher.glass'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
        manifestPlaceholders = [launcherLabel: 'TCL Liquid Glass']
    }

    buildTypes {
        debug {
            applicationIdSuffix '.teste'
            manifestPlaceholders = [launcherLabel: 'TCL Liquid Glass (Teste)']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
