name: Verificar APK Liquid Glass
on:
  pull_request:
    branches: [main]
  push:
    branches: [melhorias-launcher-liquid-glass]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Liquid-Glass-APK-teste
          path: app/build/outputs/apk/debug/*.apk
