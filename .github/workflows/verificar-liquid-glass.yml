name: Verificar APK Liquid Glass
on:
  pull_request:
    branches: [main]
  push:
    branches: [melhorias-launcher-liquid-glass]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Localizar SDK Android e instalar plataforma
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager não encontrado"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Liquid-Glass-APK-teste
          path: app/build/outputs/apk/debug/*.apk
